<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Waifu Mini App</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#fff;--fg:#111;--card:#f2f2f7;--ac:#2481cc;--mu:#888}
@media(prefers-color-scheme:dark){:root{--bg:#17212b;--fg:#fff;--card:#232e3c;--mu:#8b98a5}}
*{box-sizing:border-box}body{margin:0;padding:12px 12px 24px;background:var(--tg-theme-bg-color,var(--bg));color:var(--tg-theme-text-color,var(--fg));font:15px system-ui,sans-serif}
.card{background:var(--tg-theme-secondary-bg-color,var(--card));border-radius:12px;padding:10px 12px;margin:8px 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.stats b{display:block;font-size:18px}
.tabs{display:flex;gap:6px;margin:10px 0}.tabs button{flex:1;padding:9px;border:0;border-radius:10px;background:var(--tg-theme-secondary-bg-color,var(--card));color:inherit;font-size:14px}
.tabs .on{background:var(--tg-theme-button-color,var(--ac));color:var(--tg-theme-button-text-color,#fff)}
input{width:100%;padding:10px;border-radius:10px;border:0;background:var(--tg-theme-secondary-bg-color,var(--card));color:inherit;font-size:15px}
.chips{display:flex;gap:6px;overflow-x:auto;margin:8px 0}.chips span{padding:5px 10px;border-radius:14px;background:var(--tg-theme-secondary-bg-color,var(--card));white-space:nowrap;font-size:13px}.chips .on{outline:2px solid var(--tg-theme-button-color,var(--ac))}
.row{display:flex;justify-content:space-between;gap:8px}.mu{color:var(--tg-theme-hint-color,var(--mu));font-size:13px}
.bar{height:8px;border-radius:4px;background:#8884;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--tg-theme-button-color,var(--ac))}
</style></head><body>
<div id="app"><p class="mu">Yuklanmoqda…</p></div>
<script>
const tg=window.Telegram&&Telegram.WebApp;if(tg){tg.ready();tg.expand()}
const $=s=>document.querySelector(s),esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let D,tab="h",flt=0,q="";
async function load(){
  const p=new URLSearchParams(location.search).get("d");
  if(!p)throw 0;
  const b=atob(p.replace(/-/g,"+").replace(/_/g,"/")),u=Uint8Array.from(b,c=>c.charCodeAt(0));
  const t=await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream("deflate"))).text();
  return JSON.parse(t);
}
function draw(){
  const R=D.r,h=D.h||[],copies=h.reduce((a,x)=>a+x[4],0);
  let html=`<div class="card"><b>👤 ${esc(D.n)}</b><div class="stats" style="margin-top:8px">
  <div><b>${D.c<0?"♾️":D.c.toLocaleString()}</b><span class="mu">🪙 coin</span></div>
  <div><b>${D.x.toLocaleString()}</b><span class="mu">⭐ XP</span></div>
  <div><b>${D.w}</b><span class="mu">⚔️ g‘alaba</span></div></div>
  <div class="mu" style="margin-top:8px;text-align:center">📚 ${h.length} ta personaj · ${copies} nusxa</div></div>
  <div class="tabs"><button data-t="h" class="${tab=="h"?"on":""}">💖 Harem</button><button data-t="s" class="${tab=="s"?"on":""}">🧩 To‘plamlar</button></div>`;
  if(tab=="h"){
    html+=`<input id="q" placeholder="🔎 Ism yoki anime" value="${esc(q)}"><div class="chips"><span data-f="0" class="${flt==0?"on":""}">🌐 Hammasi</span>`
      +Object.keys(R).map(k=>`<span data-f="${k}" class="${flt==k?"on":""}">${R[k][0]} ${esc(R[k][1])}</span>`).join("")+"</div>";
    const L=h.filter(x=>(!flt||x[3]==flt)&&(x[1]+" "+x[2]).toLowerCase().includes(q.toLowerCase()));
    html+=L.length?L.map(x=>`<div class="card row"><div><b>${(R[x[3]]||["🟠"])[0]} ${esc(x[1])}</b><div class="mu">🎬 ${esc(x[2])} · 🆔 ${x[0]}</div></div><div class="mu">x${x[4]}</div></div>`).join(""):'<p class="mu">Hech narsa topilmadi.</p>';
    if(D.h&&h.length>=1)html+='<p class="mu" style="text-align:center">Ko‘p personajda ro‘yxat eng noyoblaridan boshlanadi. To‘liq ro‘yxat: /harem</p>';
  }else{
    html+=(D.s||[]).length?D.s.map(x=>`<div class="card"><div class="row"><b>${x[3]?"✅":x[1]==x[2]?"🎁":"🔸"} ${esc(x[0])}</b><span class="mu">${x[1]}/${x[2]}</span></div><div class="bar"><i style="width:${Math.round(100*x[1]/x[2])}%"></i></div></div>`).join("")+'<p class="mu" style="text-align:center">Mukofotni botda /sets orqali oling.</p>':'<p class="mu">To‘plamlar hali yo‘q.</p>';
  }
  $("#app").innerHTML=html;
  document.querySelectorAll("[data-t]").forEach(e=>e.onclick=()=>{tab=e.dataset.t;draw()});
  document.querySelectorAll("[data-f]").forEach(e=>e.onclick=()=>{flt=+e.dataset.f;draw()});
  const i=$("#q");if(i)i.oninput=()=>{q=i.value;const p=i.selectionStart;draw();const n=$("#q");n.focus();n.setSelectionRange(p,p)};
}
load().then(d=>{D=d;draw()}).catch(()=>{$("#app").innerHTML='<div class="card">📱 Bu sahifani botdagi <b>/app</b> tugmasi orqali oching.</div>'});
</script></body></html>
