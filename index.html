.card{background:var(--card);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:10px 12px;margin:8px 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.stats b{display:block;font-size:18px}
.tabs{display:flex;gap:6px;margin:10px 0;overflow-x:auto}.tabs button{flex:none;white-space:nowrap;padding:9px 12px;border:0;border-radius:10px;background:var(--card);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:inherit;font-size:13.5px}
.tabs .on{background:var(--ac);color:var(--acfg)}
input{width:100%;padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,.1);background:var(--card);color:inherit;font-size:15px}
input::placeholder{color:var(--mu)}
.chips{display:flex;gap:6px;overflow-x:auto;margin:8px 0}.chips span{padding:5px 10px;border-radius:14px;background:var(--card);white-space:nowrap;font-size:13px}.chips .on{outline:2px solid var(--ac)}
.row{display:flex;justify-content:space-between;gap:8px}.mu{color:var(--mu);font-size:13px}
.bar{height:8px;border-radius:4px;background:rgba(255,255,255,.18);margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.cmd{cursor:pointer;-webkit-tap-highlight-color:transparent}.cmd:active{background:rgba(108,157,255,.3)}
.cmd code{font:600 15px ui-monospace,monospace;color:#9fc0ff}.cmd .mu{margin-top:2px}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:rgba(0,0,0,.82);color:#fff;padding:8px 14px;border-radius:18px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
.ti{width:44px;height:60px;object-fit:cover;border-radius:8px;flex:none;background:#8883}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.gc{background:var(--card);border-radius:12px;padding:6px;overflow:hidden;opacity:.6}.gc.own{opacity:1;outline:2px solid var(--ac)}
.gc b{display:block;font-size:12.5px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gc .mu{display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gi{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px;display:block;background:#8883}
.more{width:100%;padding:10px;border:0;border-radius:10px;background:var(--ac);color:#fff;font-size:14px;margin:6px 0}
#mdl{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:16px;color:#fff;text-align:center;z-index:9}
#mdl.on{display:flex}#mdl img{max-width:100%;max-height:74vh;border-radius:12px}
.gw{position:relative;overflow:hidden;border-radius:8px}.gw .cnt{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.68);color:#fff;border-radius:9px;padding:1px 8px;font-size:12px;font-weight:600}
.gc.hv{opacity:1}
#sh{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:flex-end;justify-content:center;z-index:10}
#sh.on{display:flex}
.shb{width:100%;max-width:520px;max-height:92vh;overflow:auto;background:#151a2b;border-radius:18px 18px 0 0;padding:14px;display:flex;flex-direction:column;gap:8px}
.shb img{width:100%;max-height:42vh;object-fit:contain;border-radius:10px;background:#0006}
.shb input,.shb select{width:100%;padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);color:#fff;font-size:15px}
.shb select option{color:#000}
.shb button{padding:11px;border:0;border-radius:10px;font-size:14px;color:#fff;background:var(--ac)}
.shb .bd{background:#c0392b}.shb .bx{background:rgba(255,255,255,.12)}
#shm{min-height:18px;font-size:13px;color:#ffb3b3;text-align:center}
.more:disabled{opacity:.5}
.dots{display:flex;gap:5px;justify-content:center;margin-bottom:8px}.dots span{width:34px;height:34px;line-height:34px;border-radius:50%;background:rgba(255,255,255,.12);font-size:13px}.dots .on{background:var(--ac)}
.wh{position:relative;width:280px;max-width:100%;margin:14px auto 10px}.wh canvas{width:100%;height:auto;display:block;transition:transform 4.2s cubic-bezier(.17,.67,.12,1)}
.wp{position:absolute;top:-10px;left:50%;margin-left:-11px;z-index:2;border-left:11px solid transparent;border-right:11px solid transparent;border-top:24px solid #ffd54a}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.93)}}
@keyframes shm{to{background-position:-200% 0}}
@keyframes sw{0%,55%{left:-70%}100%{left:130%}}
@keyframes gl4{50%{box-shadow:0 0 14px 2px rgba(80,220,255,.65)}}
@keyframes gl6{50%{box-shadow:0 0 16px 3px rgba(170,90,255,.75)}}
@keyframes gl3{50%{box-shadow:0 0 12px 2px rgba(255,130,190,.6)}}
@keyframes zm{from{opacity:0;transform:scale(.6) rotate(-4deg)}}
@keyframes fl{50%{transform:translateY(-7px)}}
@keyframes br{50%{transform:scale(1.07)}}
.gi,.ti{background:linear-gradient(100deg,#8883 30%,#fff4 50%,#8883 70%) 0 0/200% 100%;animation:shm 1.3s linear infinite}
.gi.ld,.ti.ld{animation:none;background:#8883}
.an .gi:not(.ld),.an .ti:not(.ld){filter:blur(14px);transform:scale(1.08)}
.gi,.ti{transition:filter .5s ease,transform .5s ease}
.an .gc{animation:pop .45s ease backwards}
.an .gc:nth-child(3n+2){animation-delay:.07s}.an .gc:nth-child(3n){animation-delay:.14s}
.gc{transition:transform .15s}.gc:active{transform:scale(.95)}
.gc.r3{animation:gl3 2.6s ease-in-out infinite}
.gc.r4{animation:gl4 2.2s ease-in-out infinite}
.gc.r6{animation:gl6 2s ease-in-out infinite}
.an .gc.r3,.an .gc.r4,.an .gc.r6{animation:pop .45s ease backwards,gl4 2.2s ease-in-out .5s infinite}
.an .gc.r3{animation-name:pop,gl3}.an .gc.r6{animation-name:pop,gl6}
.r4 .gw::after,.r6 .gw::after{content:"";position:absolute;top:0;left:-70%;width:45%;height:100%;pointer-events:none;background:linear-gradient(105deg,transparent,rgba(255,255,255,.4),transparent);transform:skewX(-18deg);animation:sw 3.4s ease-in-out infinite}
#mdl.on img{animation:zm .35s ease,fl 3.2s ease-in-out .35s infinite}
.bs .ti{animation:br 2.2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

  if(tab=="g"){drawWheel();const s=$("#spin");if(s)s.onclick=doSpin}
  if(tab=="d"){const b=$("#dclaim");if(b)b.onclick=async()=>{b.disabled=true;const r=await act({op:"daily"});
    if(r.ok){D.c=r.c;D.x=r.x;D.dl=r.dl;toast("🎁 +"+r.r.toLocaleString()+" 🪙")}else toast(r.err||"Xato");draw()}}
  if(tab=="b"){
    document.querySelectorAll("[data-at]").forEach(e=>e.onclick=()=>bossAct("hit",e.dataset.at));
    document.querySelectorAll("[data-sp]").forEach(e=>e.onclick=()=>bossAct("spawn",e.dataset.sp));
    document.querySelectorAll("[data-kl]").forEach(e=>e.onclick=()=>{if(confirm("Boss qochirilsinmi?"))bossAct("kill",e.dataset.kl)});
    const r=$("#brf");if(r)r.onclick=loadBoss}}
setInterval(()=>{if(tab=="b"&&!BB)loadBoss()},15000);
load().then(d=>{D=d;draw();live()}).catch(()=>{$("#app").innerHTML='<div class="card">📱 Bu sahifani botdagi <b>/app</b> tugmasi orqali oching.</div>'});
</script><div id="toast"></div><div id="sh"></div><div id="mdl" onclick="this.className=''"></div></body></html>
